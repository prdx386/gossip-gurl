name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parser tests
        run: python3 -I -m unittest discover -s tests -v
      - name: Frontmatter checks
        run: |
          python3 - <<'PY'
          import re, sys
          t = open("SKILL.md", encoding="utf-8").read()
          fm = t.split("---")[1]
          desc = re.search(r"^description: (.*)$", fm, re.M).group(1)
          assert len(desc) <= 1024, f"description too long: {len(desc)}"
          keys = {l.split(":")[0].strip() for l in fm.splitlines() if l and not l.startswith(" ")}
          assert keys <= {"name", "description", "license", "allowed-tools", "metadata", "compatibility"}, keys
          print(f"description {len(desc)} chars, keys {sorted(keys)}")
          PY
      - name: No personal data markers in evals
        run: |
          ! grep -nE "Ansprechpartner(in)?: [A-ZÄÖÜ][a-zäöü]+ [A-ZÄÖÜ][a-zäöü]+" evals/evals.json
